name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build release artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Validate
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: "true"
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          xvfb-run -a npm run e2e

      - name: Create release archive
        run: |
          mkdir -p release
          tar \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=release \
            -czf release/bucket-command-${GITHUB_REF_NAME:-manual}.tar.gz \
            .

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: bucket-command-${{ github.ref_name || 'manual' }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 30
