name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Electron E2E
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: "true"
          BUCKET_COMMAND_E2E_ARTIFACT_DIR: test-results/desktop-e2e
        run: xvfb-run -a npm run e2e

      - name: Upload Electron E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/desktop-e2e/
          if-no-files-found: ignore
          retention-days: 7
